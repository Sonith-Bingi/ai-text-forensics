[project]
name = "ai-text-forensics"
version = "0.1.0"
description = "Machine-generated text detection: multi-signal ensemble with generalization and adversarial robustness evaluation"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.33",
    "datasets>=2.20",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "lightgbm>=4.4",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "shap>=0.46",
    "textstat>=0.7",
    "emoji>=2.12",
    "ftfy>=6.2",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "mlflow>=2.15",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "gradio>=4.44",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
